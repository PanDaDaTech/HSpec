name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Locate Visual Studio
      id: vs
      shell: cmd
      run: |
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -property installationPath`) do (
            echo VS_PATH=%%i>> "%GITHUB_OUTPUT%"
            echo [Info] Found VS at: %%i
        )

    - name: Build x64
      shell: cmd
      run: |
        call "${{ steps.vs.outputs.VS_PATH }}\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
        if %errorlevel% neq 0 exit /b 1
        if not exist "build\x64" mkdir "build\x64"
        if not exist "dist\x64" mkdir "dist\x64"
        rc /nologo /c65001 /fo "build\x64\hspec.res" "hspec.rc"
        if %errorlevel% neq 0 exit /b %errorlevel%
        cl /nologo /utf-8 /O2 /MT /EHsc /std:c++17 /D_WIN32_WINNT=0x0601 hspec.cpp "build\x64\hspec.res" /link /OUT:"dist\x64\HSpec_x64.exe" /SUBSYSTEM:WINDOWS gdiplus.lib crypt32.lib advapi32.lib user32.lib gdi32.lib
        if %errorlevel% neq 0 exit /b %errorlevel%
        echo [x64] Build succeeded.

    - name: Build x86
      shell: cmd
      run: |
        call "${{ steps.vs.outputs.VS_PATH }}\Common7\Tools\VsDevCmd.bat" -arch=x86
        if %errorlevel% neq 0 exit /b 1
        if not exist "build\x86" mkdir "build\x86"
        if not exist "dist\x86" mkdir "dist\x86"
        rc /nologo /c65001 /fo "build\x86\hspec.res" "hspec.rc"
        if %errorlevel% neq 0 exit /b %errorlevel%
        cl /nologo /utf-8 /O2 /MT /EHsc /std:c++17 /D_WIN32_WINNT=0x0601 hspec.cpp "build\x86\hspec.res" /link /OUT:"dist\x86\HSpec_x86.exe" /SUBSYSTEM:WINDOWS gdiplus.lib crypt32.lib advapi32.lib user32.lib gdi32.lib
        if %errorlevel% neq 0 exit /b %errorlevel%
        echo [x86] Build succeeded.

    - name: Build arm64
      shell: cmd
      run: |
        call "${{ steps.vs.outputs.VS_PATH }}\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=x64
        if %errorlevel% neq 0 exit /b 1
        if not exist "build\arm64" mkdir "build\arm64"
        if not exist "dist\arm64" mkdir "dist\arm64"
        rc /nologo /c65001 /fo "build\arm64\hspec.res" "hspec.rc"
        if %errorlevel% neq 0 exit /b %errorlevel%
        cl /nologo /utf-8 /O2 /MT /EHsc /std:c++17 /D_WIN32_WINNT=0x0601 hspec.cpp "build\arm64\hspec.res" /link /OUT:"dist\arm64\HSpec_arm64.exe" /SUBSYSTEM:WINDOWS gdiplus.lib crypt32.lib advapi32.lib user32.lib gdi32.lib
        if %errorlevel% neq 0 exit /b %errorlevel%
        echo [arm64] Build succeeded.

    - name: Upload x64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: HSpec_x64
        path: dist/x64/HSpec_x64.exe

    - name: Upload x86 artifact
      uses: actions/upload-artifact@v4
      with:
        name: HSpec_x86
        path: dist/x86/HSpec_x86.exe

    - name: Upload arm64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: HSpec_arm64
        path: dist/arm64/HSpec_arm64.exe
